server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 업로드 한도. 백엔드의 multipart 한도(5MB)보다 약간 크게 잡는다.
    # 여기가 더 작으면 백엔드의 친절한 413 대신 nginx가 먼저 잘라버린다.
    client_max_body_size 6m;

    # API는 전부 /api 아래로 보낸다.
    # 접두사가 없으면 /characters, /signup 같은 경로가 화면 라우트인지 API인지 구분할 수 없다
    # (둘 다 존재한다 — /characters/3/edit 은 화면, /characters/3 은 API).
    # 백엔드도 server.servlet.context-path=/api 로 같은 값을 쓴다.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 채팅 응답은 SSE라 버퍼링을 끄지 않으면 토큰이 실시간으로 안 나오고 한 번에 몰려 나온다.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # SPA — 새로고침이나 링크로 직접 들어온 경로도 index.html이 받아 라우터가 처리한다.
    location / {
        # 다른 사이트가 화면을 iframe으로 띄우지 못하게 막는다(클릭재킹 방지).
        # /api 응답은 백엔드(Spring Security 기본값)가 같은 헤더를 붙이므로 여기에만 둔다.
        add_header X-Frame-Options DENY always;
        try_files $uri $uri/ /index.html;
    }
}
