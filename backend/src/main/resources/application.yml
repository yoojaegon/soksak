# API 경로 접두사. 화면 라우트(/characters/3/edit)와 API 경로(/characters/3)가 겹쳐서,
# 배포 환경의 nginx가 둘을 가르는 기준이 이 접두사다. 프론트(api.js의 API_BASE)도 같은 값을 쓴다.
server:
  servlet:
    context-path: /api

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/soksak}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 5MB      # 프론트가 업로드 전에 1024px로 줄이므로 실제로는 훨씬 작게 올라온다.
      max-request-size: 6MB   # 파일 + 나머지 파트 합계

  jpa:
    hibernate:
      ddl-auto: update
    # show-sql은 System.out으로 직접 찍혀서 로그 레벨·패턴·traceId를 전부 비껴간다(배포에서도 못 끈다).
    # 같은 일을 logging.level.org.hibernate.SQL이 하므로 아래 logging 블록으로 옮겼다.
    properties:
      hibernate:
        format_sql: true

# 이 프로젝트엔 Spring 프로필이 없다(compose의 profiles는 compose 전용). 그래서 환경별 차이는
# DB_URL과 같은 방식 — 기본값은 배포에 안전한 값으로 두고, 필요한 쪽에서만 .env로 덮어쓴다.
# 컨테이너로 내려보내는 자리는 docker-compose.yml의 backend.environment다(거기 없으면 안 먹는다).
# 참고: 로그 레벨은 DB_URL과 달리 빈 문자열이 주입돼도 안전하다 — Map<String, LogLevel> 바인딩이
#       빈 값을 가진 키를 아예 버려서 "설정 안 함"이 되고 ROOT 레벨을 그대로 상속한다.
logging:
  level:
    com.soksak: ${LOG_LEVEL_APP:INFO}      # 로컬에서 훑어볼 땐 DEBUG
    org.hibernate.SQL: ${LOG_LEVEL_SQL:OFF}  # DEBUG로 올리면 실행 SQL이 찍힌다(옛 show-sql)
  pattern:
    # [traceId/loginId] — 요청 하나의 로그를 이어붙이는 기준. 비로그인 요청은 뒤가 빈다.
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%X{traceId:-}/%X{user:-}]){magenta} %clr(%-40.40logger{39}){cyan} : %m%n%wEx"

# 업로드된 이미지 저장 위치·주소.
# dir 기본값은 실행 디렉터리(bootRun 기준 레포 루트) 기준 상대 경로이고,
# 배포에서는 컨테이너의 볼륨 경로(/data/uploads)를 UPLOADS_DIR로 덮어쓴다.
# 오브젝트 스토리지로 옮길 때 ImageStorageService만 바꾸면 되고 이 계약은 유지된다.
uploads:
  dir: ${UPLOADS_DIR:uploads}
  public-path: /uploads
  # 사용자별 업로드 한도(검사까지 간 것만 센다 — 차단 포함, 형식 오류·검사 실패 제외). 창은 롤링.
  limit:
    per-hour: 10
    per-day: 30
    # 최근 24시간 차단이 이만큼이면 업로드만 잠근다(기준점에 걸리는 정상 이미지도 있어 1~2회는 봐준다).
    block-lock: 3
    # 전체 사용자 합산 24시간 상한 — 다계정 우회 대비. 지금 규모에선 닿지 않는 값.
    global-per-day: 500

# 캐릭터 신고 자동 숨김. 창 = max(캐릭터 마지막 수정, 지금 - window-days) 안의 서로 다른 신고자 수로 판정한다.
# 같은 사람의 신고는 몇 번이든 1명 — 창이 지나거나 캐릭터가 고쳐진 뒤 다시 신고하면 새로 센다.
reports:
  hide-threshold: 30
  window-days: 30

# 업로드 이미지 검사(OpenAI omni-moderation). 기준점은 코드(ModerationPolicy)에 있다 — 결정 기록 D17.
# 키가 비어 있어도 앱은 뜨지만 업로드는 전부 503으로 거부된다(fail-closed).
moderation:
  api-key: ${OPENAI_API_KEY:}
  base-url: https://api.openai.com/v1
  model: omni-moderation-latest
  connect-timeout: 3000
  read-timeout: 10000   # 사용자가 업로드 버튼을 누르고 기다리는 시간이라 LLM 호출보다 짧게.

jwt:
  issuer: soksak
  secret-key: ${JWT_SECRET_KEY}
  access-token-expiration: 3600000      # 1h (ms)
  refresh-token-expiration: 1209600000  # 14d (ms)

ai-server:
  # 로컬은 uvicorn 기본 포트, 배포는 컨테이너 서비스 이름(http://ai-server:8000)을 환경변수로 덮어쓴다.
  base-url: ${AI_SERVER_BASE_URL:http://localhost:8000}
  connect-timeout: 3000             # 연결 타임아웃 (ms)
  read-timeout: 60000               # 응답 대기 (ms) — LLM 호출이라 길게.
                                    # ai-server의 CHAT_/SUMMARY_ TIMEOUT과 같이 움직여야 한다.
                                    # 여기가 더 짧으면 ai-server가 아직 기다리는 중에 백엔드가
                                    # 먼저 포기해, ai-server 쪽 상향이 아무 효과가 없다.
  internal-auth-secret: ${INTERNAL_AUTH_SECRET}