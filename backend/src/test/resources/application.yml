# DB는 TestcontainersConfig가 띄우는 Postgres 컨테이너다. 접속 정보는 @ServiceConnection이 채운다.
# 스키마도 운영과 같은 Flyway 마이그레이션으로 만든다.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

jwt:
  issuer: soksak
  secret-key: IE8SEbMtNMJpUm5orEUveXx5hGmgSnYjymjdZ1i/CsE=
  access-token-expiration: 3600000      # 1h (ms)
  refresh-token-expiration: 1209600000  # 14d (ms)

# 테스트에선 StubChatAiClient가 동작해 실제 호출은 없지만,
# RestClientConfig 빈이 placeholder를 요구하므로 값만 채워둔다.
ai-server:
  base-url: http://localhost:8000
  connect-timeout: 3000
  read-timeout: 30000
  internal-auth-secret: test-internal-secret

# WebConfig·ImageStorageService가 기본값 없이 요구하므로 채워둔다.
# build/ 아래라 gradle clean으로 같이 지워진다.
uploads:
  dir: build/test-uploads
  public-path: /uploads