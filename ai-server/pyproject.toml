[project]
name = "soksak-llm-service"
version = "0.1.0"
description = "Soksak LLM service (FastAPI + LangChain). Stateless gateway for Java backend."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "langchain>=0.3",
    # 제공사 네이티브 SDK 직결. OpenAI 호환 엔드포인트(langchain-openai)를 쓰던 시절엔
    # 클래스가 하나였지만, 호환 레이어가 구조화 출력과 프롬프트 캐싱을 지원하지 않아
    # 제공사별 클래스로 옮겼다(llm/factory.py).
    "langchain-anthropic>=1.7.1",
    "langchain-google-genai>=4.4.0",
    # LangChain을 거치지 않는 토큰 수 세기(/v1/messages/count_tokens) 전용.
    # langchain-anthropic이 끌어오지만 직접 import하므로 명시해 둔다.
    "anthropic>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
