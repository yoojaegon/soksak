[project]
name = "soksak-llm-service"
version = "0.1.0"
description = "Soksak LLM service (FastAPI + LangChain). Stateless gateway for Java backend."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    # 채팅용이 아니라 토큰 수 세기(/v1/messages/count_tokens) 전용. 채팅은 게이트웨이를
    # 거치지만 이 엔드포인트는 Anthropic 직결이라 SDK가 따로 필요하다.
    "anthropic>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
